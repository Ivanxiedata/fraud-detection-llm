[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "datasets>=4.5.0",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "torch>=2.10.0",
    "transformers>=5.1.0",
    "trl>=0.27.2",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "prepare_data", "finetune", "inference"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
